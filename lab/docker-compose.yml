services:
  dvwa:
    image: ghcr.io/digininja/dvwa:068d974 # tag commit mới nhất được lấy từ https://github.com/digininja/DVWA/pkgs/container/dvwa
    environment:
      - DB_SERVER=db
    depends_on: [db]
    networks: [labnet]
    restart: unless-stopped

  db:
    image: mariadb:10.11
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-dvwa_root_lab_only}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-dvwa}
      - MYSQL_USER=${MYSQL_USER:-dvwa}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-dvwa_lab_only}
    volumes:
      - dvwa_db:/var/lib/mysql
    networks: [labnet]
    restart: unless-stopped

  bwapp:
    image: raesene/bwapp
    networks: [labnet]
    restart: unless-stopped

networks:
  labnet:
    internal: true
volumes:
  dvwa_db:
