rules:
  - id: php-os-command-injection-taint
    languages: [php]
    severity: ERROR
    message: >-
      Du lieu tu request ($_GET/$_POST/...) di vao ham thuc thi lenh he dieu hanh
      ma khong qua escapeshellarg(). Nguy co OS Command Injection (CWE-78).
    metadata:
      cwe: "CWE-78: OS Command Injection"
      project: T05
      version: v0
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: $_GET
          - pattern: $_POST
          - pattern: $_REQUEST
          - pattern: $_COOKIE
          - pattern: $_SERVER
    pattern-sanitizers:
      - pattern: escapeshellarg(...)
    pattern-sinks:
      - pattern-either:
          - pattern: system($CMD, ...)
          - pattern: exec($CMD, ...)
          - pattern: shell_exec($CMD)
          - pattern: passthru($CMD, ...)
          - pattern: popen($CMD, ...)
          - patterns:
              - pattern: proc_open($CMD, ...)
              # proc_open voi mang doi so (PHP >= 7.4) khong goi shell -> khong phai sink
              - pattern-not: proc_open([...], ...)
